version: '3'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - strapi-network

  strapi:
    build: .
    container_name: strapi-app
    ports:
      - "1337:1337"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      APP_KEYS: StrapiSecretKey123,StrapiSessionKey456
      API_TOKEN_SALT: X1qWQ6NhFZuIhWzLiaY+yg==
      ADMIN_JWT_SECRET: L7HDUEBEAL5J8G3Flfz+ow==
      TRANSFER_TOKEN_SALT: 9N5STMHDIBXnVRtnURkkqQ==
      ENCRYPTION_KEY: dpgBNODZDz9Pz1mocHcMLg==
      JWT_SECRET: 7k+29+0L2LYIUJjYMkAPhw==
    depends_on:
      - postgres
    networks:
      - strapi-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - strapi
    networks:
      - strapi-network

volumes:
  pgdata:

networks:
  strapi-network:
    driver: bridge
