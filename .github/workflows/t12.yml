name: Task 12 - Blue/Green ECS Deployment

on:
  push:
    branches:
      - santhosh

jobs:
  deploy:
    name: Deploy to ECS Fargate via CodeDeploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-2
      ECR_REPO: strapi-sk
      ECS_CLUSTER: strapi-cluster-sk
      ECS_SERVICE: strapi-service-sk
      CODEDEPLOY_APP: strapi-codedeploy-sk
      DEPLOYMENT_GROUP: strapi-codedeploy-dg-sk
      S3_BUCKET: sandy-starpi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REPO:$IMAGE_TAG ./strapi-app
          docker tag $ECR_REPO:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Create imagedefinitions.json
        run: |
          echo '[{"name":"strapi-container","imageUri":"'"$IMAGE_URI"'"}]' > imagedefinitions.json

      - name: Create appspec.yaml
        run: |
          cat <<EOF > appspec.yaml
          version: 1
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: ""
                  LoadBalancerInfo:
                    ContainerName: "strapi-container"
                    ContainerPort: 1337
          EOF

      - name: Upload deployment files to S3
        run: |
          aws s3 cp appspec.yaml s3://$S3_BUCKET/appspec.yaml
          aws s3 cp imagedefinitions.json s3://$S3_BUCKET/imagedefinitions.json

      - name: Trigger CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name $CODEDEPLOY_APP \
            --deployment-group-name $DEPLOYMENT_GROUP \
            --s3-location bucket=$S3_BUCKET,bundleType=YAML,key=appspec.yaml \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --deployment-style deploymentType=BLUE_GREEN,deploymentOption=WITH_TRAFFIC_CONTROL


