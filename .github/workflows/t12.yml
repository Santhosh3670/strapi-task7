name: Deploy to ECS via CodeDeploy

on:
  push:
    branches:
      - santhosh

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: strapi-sk
  ECS_CLUSTER: strapi-cluster-sk
  ECS_SERVICE: strapi-service-sk
  CODEDEPLOY_APPLICATION: strapi-codedeploy-sk
  CODEDEPLOY_DEPLOYMENT_GROUP: strapi-dg-sk

jobs:
  deploy:
    name: Deploy Strapi to ECS Fargate via CodeDeploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract image tag
        id: image_tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} ./strapi-app
          docker tag ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Register new ECS task definition
        id: task-def
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query "services[0].taskDefinition" \
            --output text)

          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $TASK_DEF_ARN)

          UPDATED_TASK_DEF=$(echo $NEW_TASK_DEF | \
            jq --arg IMAGE_URI "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" \
              '.taskDefinition | 
              { 
                family, 
                executionRoleArn, 
                taskRoleArn, 
                networkMode, 
                containerDefinitions: [.containerDefinitions[0] + {image: $IMAGE_URI}], 
                requiresCompatibilities, 
                cpu, 
                memory 
              }')

          echo "$UPDATED_TASK_DEF" > taskdef.json

          REGISTERED_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "TASK_DEF_ARN=$REGISTERED_TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Trigger deployment using CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name $CODEDEPLOY_APPLICATION \
            --deployment-group-name $CODEDEPLOY_DEPLOYMENT_GROUP \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --description "GitHub Actions deployment - $GITHUB_SHA" \
            --github-location repository=${{ github.repository }},commitId=${{ github.sha }}

