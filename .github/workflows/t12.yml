name: Task 12 - Blue/Green ECS Deployment

on:
  push:
    branches:
      - santhosh

jobs:
  deploy:
    name: Deploy to ECS Fargate via CodeDeploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-2
      ECR_REPO: strapi-sk
      ECS_CLUSTER: strapi-cluster-sk
      ECS_SERVICE: strapi-service-sk
      CODEDEPLOY_APP: strapi-codedeploy-sk
      DEPLOYMENT_GROUP: strapi-deployment-group-sk
      S3_BUCKET: sandy-starpi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REPO:$IMAGE_TAG ./strapi-app
          docker tag $ECR_REPO:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Create imagedefinitions.json
        run: |
          echo '[{"name":"strapi-container","imageUri":"'"$IMAGE_URI"'"}]' > imagedefinitions.json

      - name: Register new ECS task definition and get ARN
        id: register-task-def
        run: |
          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --family strapi-task-def-sk \
            --execution-role-arn arn:aws:iam::607700977843:role/ecs-task-execution-role \
            --network-mode awsvpc \
            --container-definitions "[{\"name\":\"strapi-container\",\"image\":\"${IMAGE_URI}\",\"portMappings\":[{\"containerPort\":1337,\"protocol\":\"tcp\"}],\"essential\":true}]" \
            --requires-compatibilities FARGATE \
            --cpu "256" \
            --memory "512" \
            --task-role-arn arn:aws:iam::607700977843:role/ecs-task-execution-role \
            --region $AWS_REGION \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "TASK_DEF_ARN=$NEW_TASK_DEF" >> $GITHUB_ENV

      - name: Create appspec.yaml
        run: |
          cat > appspec.yaml <<EOF
          version: 0.0
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: "${TASK_DEF_ARN}"
                  LoadBalancerInfo:
                    ContainerName: "strapi-container"
                    ContainerPort: 1337
                  PlatformVersion: "LATEST"
          EOF

      - name: Zip deployment files
        run: |
          mkdir -p bundle
          cp appspec.yaml imagedefinitions.json bundle/
          cd bundle && zip ../strapi-deployment-${{ github.sha }}.zip * && cd ..

      - name: Upload zip to S3
        run: |
          aws s3 cp strapi-deployment-${{ github.sha }}.zip s3://$S3_BUCKET/revisions/strapi-deployment-${{ github.sha }}.zip

      - name: Upgrade AWS CLI to v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Trigger CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name strapi-codedeploy-sk \
            --deployment-group-name strapi-deployment-group-sk \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --s3-location bucket=sandy-starpi,key=revisions/strapi-deployment-${{ github.sha }}.zip,bundleType=zip \
            --region us-east-2
           

