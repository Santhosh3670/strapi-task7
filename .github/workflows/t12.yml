name: Deploy to ECS with CodeDeploy

on:
  push:
    branches:
      - santhosh

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build and push Docker image to ECR
        run: |
          IMAGE_URI=607700977843.dkr.ecr.us-east-2.amazonaws.com/strapi-repo-sk:${IMAGE_TAG}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Update ECS task definition
        id: task-def
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition strapi-taskdef-bluegreen-sk \
            --query taskDefinition \
            --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "607700977843.dkr.ecr.us-east-2.amazonaws.com/strapi-repo-sk:${IMAGE_TAG}" \
            '.containerDefinitions[0].image = $IMAGE')

          echo "$NEW_TASK_DEF" > new-taskdef.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Trigger CodeDeploy Deployment
        run: |
          aws deploy create-deployment \
            --application-name strapi-app-codedeploy-sk \
            --deployment-group-name strapi-deployment-group-sk \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --region us-east-2 \
            --description "GitHub SHA: $GITHUB_SHA" \
            --github-location repository=${{ github.repository }},commitId=${{ github.sha }}

