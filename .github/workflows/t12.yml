name: Blue/Green Deploy via GitHub Actions (No Terraform)

on:
  push:
    branches:
      - santhosh

jobs:
  deploy:
    name: Deploy to ECS with CodeDeploy
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-2
      ECR_REPO_NAME: strapi-sk
      ECS_CLUSTER: strapi-cluster-sk
      ECS_SERVICE: strapi-service-sk
      TASK_DEF_FAMILY: strapi-task-sk
      CONTAINER_NAME: strapi-container
      CODEDEPLOY_APP_NAME: strapi-codedeploy-app-sk
      CODEDEPLOY_GROUP_NAME: strapi-deployment-group-sk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          IMAGE_URI=607700977843.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_NAME}:${IMAGE_TAG}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          docker build -t $IMAGE_URI ./strapi-app
          docker push $IMAGE_URI

      - name: Get Current Task Definition
        id: get-task
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_DEF_FAMILY" \
            --query taskDefinition > task-def.json

      - name: Create New Task Definition Revision with Updated Image
        id: register-task
        run: |
          IMAGE_URI=${{ env.IMAGE_URI }}
          jq --arg IMAGE "$IMAGE_URI" '
            .containerDefinitions[0].image = $IMAGE |
            {
              family: .family,
              executionRoleArn: .executionRoleArn,
              taskRoleArn: .taskRoleArn,
              networkMode: .networkMode,
              containerDefinitions: .containerDefinitions,
              requiresCompatibilities: .requiresCompatibilities,
              cpu: .cpu,
              memory: .memory
            }
          ' task-def.json > new-task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Trigger CodeDeploy Deployment
        run: |
          IMAGE_URI=${{ env.IMAGE_URI }}
          NEW_TASK_DEF_ARN=${{ env.NEW_TASK_DEF_ARN }}

          APPSPEC_CONTENT=$(cat <<EOF
version: 1
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: $NEW_TASK_DEF_ARN
        LoadBalancerInfo:
          ContainerName: $CONTAINER_NAME
          ContainerPort: 1337
EOF
)

          aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP_NAME" \
            --deployment-group-name "$CODEDEPLOY_GROUP_NAME" \
            --revision "revisionType=AppSpecContent,appSpecContent={\"content\":\"$(echo "$APPSPEC_CONTENT" | sed ':a;N;$!ba;s/\n/\\n/g')\"}" \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce \
            --description "Deploying image $IMAGE_URI"

