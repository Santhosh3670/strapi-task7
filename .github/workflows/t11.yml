name: Task 11 - Build and Deploy Strapi with CodeDeploy Blue/Green

on:
  push:
    branches:
      - santhosh

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: strapi-repo-sk
  ECS_CLUSTER: strapi-cluster-sk
  ECS_SERVICE: strapi-service-sk
  ECS_TASK_DEFINITION: strapi-task-def-sk
  DEPLOYMENT_GROUP: strapi-deployment-group-sk
  APPLICATION_NAME: strapi-codedeploy-app-sk
  IMAGE_TAG: ${{ github.sha }}
  CONTAINER_NAME: strapi-container-sk

jobs:
  deploy:
    name: Build and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::607700977843:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        working-directory: strapi-app
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Fill in new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy Amazon ECS task definition with CodeDeploy
        uses: aws-actions/aws-codedeploy-deploy-ecs@v1
        with:
          application-name: ${{ env.APPLICATION_NAME }}
          deployment-group: ${{ env.DEPLOYMENT_GROUP }}
          task-definition: ${{ steps.task-def.outputs.task-definition }}

