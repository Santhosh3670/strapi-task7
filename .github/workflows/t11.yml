name: Task 11 - Blue/Green ECS Deployment with Terraform

on:
  push:
    branches: [ santhosh ]

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: strapi-sk
  ECS_CLUSTER: strapi-cluster-sk
  ECS_SERVICE: strapi-service-sk
  CODEDEPLOY_APP: strapi-codedeploy-app-sk
  CODEDEPLOY_GROUP: strapi-codedeploy-dg-sk

jobs:
  infra-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    ##############################
    ## Terraform Infra Automation
    ##############################

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Plan
      run: terraform plan -out=tfplan
      working-directory: ./terraform

    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      working-directory: ./terraform

    ##############################
    ## Docker + ECR + CodeDeploy
    ##############################

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image
      run: |
        IMAGE_TAG=${{ github.sha }}
        docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
        docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
      working-directory: ./strapi-app

    - name: Get current ECS Task Definition
      run: |
        aws ecs describe-task-definition \
          --task-definition strapi-task-sk \
          --query taskDefinition \
          --output json > ecs-task-definition.json

    - name: Update task definition with new image
      run: |
        IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}"
        cat ecs-task-definition.json | jq --arg IMAGE "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE' > new-task-def.json

    - name: Register updated task definition
      id: register-task-def
      run: |
        TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query "taskDefinition.taskDefinitionArn" --output text)
        echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_ENV

    - name: Trigger CodeDeploy Deployment
      run: |
        aws deploy create-deployment \
          --application-name $CODEDEPLOY_APP \
          --deployment-group-name $CODEDEPLOY_GROUP \
          --deployment-config-name CodeDeployDefault.ECSCanary10Percent5Minutes \
          --description "GitHub Actions deployment - $GITHUB_SHA" \
          --github-location repository=${{ github.repository }},commitId=${{ github.sha }} \
          --file-exists-behavior OVERWRITE \
          --task-definition $task_def_arn

