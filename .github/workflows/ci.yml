name: CI - Build & Push Docker Image

on:
  push:
    branches:
      - main
      - santhosh

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: strapi-monitor

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA
        id: vars
        run: echo "sha_short=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build Docker image from strapi-app folder
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME:${{ steps.vars.outputs.sha_short }} ./strapi-app

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME:${{ steps.vars.outputs.sha_short }}

      - name: Output image tag
        run: echo "Image tag: ${{ steps.vars.outputs.sha_short }}"

